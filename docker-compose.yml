services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
