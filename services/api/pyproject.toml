[project]
name = "streaming-copilot-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "pydantic-settings>=2.7,<3",
    "alembic>=1.15,<2",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.9,<3",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "jsonschema[format]>=4.23,<5",
    "pyyaml>=6,<7",
    "openapi-spec-validator>=0.7,<1",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "psutil>=7.2.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # FastAPI dependency defaults are the framework idiom

[tool.mypy]
python_version = "3.12"
strict = true
