[project]
name = "copilot-api"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
